<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>powblock</title>
    <style>
      body {
        max-width: 40rem;
        margin: 2rem auto;
        font-family: monospace;
        line-height: 1.5;
        padding: 0 1rem;
      }
      textarea,
      input,
      select {
        width: 100%;
        font-family: monospace;
        box-sizing: border-box;
        margin-bottom: 1rem;
      }
      textarea {
        height: 16rem;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="#">powblock</a></h1>
      <nav><a href="#" id="btn-new" class="hidden">New</a></nav>
    </header>
    <main>
      <div id="status"></div>
      <section id="sec-editor">
        <textarea id="content" placeholder="Paste text here..."></textarea>
        <label
          >Expiration:
          <select id="hours">
            <option value="1">1 Hour</option>
            <option value="6">6 Hours</option>
            <option value="24" selected>24 Hours</option>
            <option value="72">3 Days</option>
            <option value="168">7 Days</option>
          </select>
        </label>
        <label
          >Secret:
          <input type="text" id="secret" />
        </label>
        <div id="mining-status" class="hidden">Mining Proof of Work... Nonce: <span id="nonce-display">0</span></div>
        <button id="btn-submit">Publish</button>
      </section>
      <section id="sec-viewer" class="hidden">
        <div>
          <span id="view-uuid"></span>
          <button id="btn-copy">Copy</button>
          <button id="btn-edit" class="hidden">Edit</button>
        </div>
        <pre><code id="view-content"></code></pre>
      </section>
    </main>
    <script>
      const crockford = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'

      function generateUlid() {
        let time = Date.now()
        let timePart = ''
        for (let i = 0; i < 10; i++) {
          timePart = crockford[time % 32] + timePart
          time = Math.floor(time / 32)
        }
        const bytes = new Uint8Array(16)
        crypto.getRandomValues(bytes)
        let randPart = ''
        for (let i = 0; i < 16; i++) {
          randPart += crockford[bytes[i] % 32]
        }
        return timePart + randPart
      }

      function generateSecret() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'
        const bytes = new Uint8Array(24)
        crypto.getRandomValues(bytes)
        let secret = ''
        for (let i = 0; i < 24; i++) {
          secret += chars[bytes[i] % chars.length]
        }
        return secret
      }

      function bytesToBigInt(u8) {
        let res = 0n
        for (let i = 0; i < u8.length; i++) {
          res = (res << 8n) | BigInt(u8[i])
        }
        return res
      }

      let currentUuid = null
      let isEditing = false
      let isMining = false

      const elEditor = document.getElementById('sec-editor')
      const elViewer = document.getElementById('sec-viewer')
      const elContent = document.getElementById('content')
      const elHours = document.getElementById('hours')
      const elSecret = document.getElementById('secret')
      const elSubmit = document.getElementById('btn-submit')
      const elNew = document.getElementById('btn-new')
      const elEdit = document.getElementById('btn-edit')
      const elCopy = document.getElementById('btn-copy')
      const elStatus = document.getElementById('status')
      const elMining = document.getElementById('mining-status')
      const elNonce = document.getElementById('nonce-display')
      const elViewUuid = document.getElementById('view-uuid')
      const elViewContent = document.getElementById('view-content')

      elSecret.value = generateSecret()

      function showStatus(msg, isError = true) {
        elStatus.textContent = msg
        elStatus.style.color = isError ? 'red' : 'green'
      }

      async function minePoW(uuid, modified, content, hours, onProgress) {
        const encoder = new TextEncoder()
        const contentBytes = encoder.encode(content)
        const bytesCount = BigInt(Math.max(contentBytes.length, 256))
        const hoursCount = BigInt(Math.max(hours, 1))
        const wf = 1000n

        const target = 2n ** 256n / (wf * bytesCount * hoursCount)
        const prefix = encoder.encode(uuid + modified + content)

        let nonce = 0
        while (isMining) {
          for (let i = 0; i < 1000; i++) {
            const cur = nonce + i
            const nonceBytes = encoder.encode(cur.toString())
            const combined = new Uint8Array(prefix.length + nonceBytes.length)
            combined.set(prefix, 0)
            combined.set(nonceBytes, prefix.length)

            const digest = await crypto.subtle.digest('SHA-256', combined)
            if (bytesToBigInt(new Uint8Array(digest)) < target) {
              return cur
            }
          }
          nonce += 1000
          onProgress(nonce)
          await new Promise(r => setTimeout(r, 0))
        }
        return null
      }

      elSubmit.onclick = async () => {
        showStatus('')
        const content = elContent.value
        const hours = parseInt(elHours.value, 10)
        const secret = elSecret.value.trim()

        if (!content) {
          showStatus('Content required')
          return
        }

        const uuid = isEditing && currentUuid ? currentUuid : generateUlid()
        const modified = Math.floor(Date.now() / 1000)

        isMining = true
        elSubmit.disabled = true
        elMining.classList.remove('hidden')

        try {
          const nonce = await minePoW(uuid, modified, content, hours, n => {
            elNonce.textContent = n
          })

          if (!nonce) return

          const resp = await fetch('/powblocks/' + uuid, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + secret,
            },
            body: JSON.stringify({ content, hours, modified, nonce }),
          })

          if (!resp.ok) {
            const data = await resp.json()
            throw new Error(data.error || 'HTTP ' + resp.status)
          }

          localStorage.setItem('secret_' + uuid, secret)
          window.location.hash = uuid
        } catch (err) {
          showStatus(err.message)
        } finally {
          isMining = false
          elSubmit.disabled = false
          elMining.classList.add('hidden')
        }
      }

      async function loadBlock(uuid) {
        showStatus('')
        try {
          const resp = await fetch('/powblocks/' + uuid)
          if (!resp.ok) throw new Error('Not found')
          const data = await resp.json()

          currentUuid = uuid
          elViewUuid.textContent = uuid
          elViewContent.textContent = data.content

          elEditor.classList.add('hidden')
          elViewer.classList.remove('hidden')
          elNew.classList.remove('hidden')

          const hasSecret = !!localStorage.getItem('secret_' + uuid)
          elEdit.classList.toggle('hidden', !hasSecret)
        } catch (err) {
          showStatus(err.message)
          showEditor(false)
        }
      }

      function showEditor(editMode) {
        isEditing = editMode
        if (!editMode) {
          currentUuid = null
          elContent.value = ''
          elSecret.value = generateSecret()
          window.location.hash = ''
        }
        elViewer.classList.add('hidden')
        elEditor.classList.remove('hidden')
        elNew.classList.toggle('hidden', !editMode)
      }

      elEdit.onclick = () => {
        elContent.value = elViewContent.textContent
        showEditor(true)
      }

      elNew.onclick = () => showEditor(false)

      elCopy.onclick = () => {
        navigator.clipboard.writeText(elViewContent.textContent)
        elCopy.textContent = 'Copied!'
        setTimeout(() => (elCopy.textContent = 'Copy'), 1500)
      }

      function route() {
        const hash = window.location.hash.replace(/^#/, '').trim()
        if (hash.length === 26) {
          loadBlock(hash)
        } else {
          showEditor(false)
        }
      }

      window.onhashchange = route
      window.onload = route
    </script>
  </body>
</html>
